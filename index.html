<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bright Mind</title>
<meta name="description" content="Bright Mind: cheerful brain games, wellness tips, and lots of love.">
<meta name="theme-color" content="#F76707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bright Mind">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
*{box-sizing:border-box}
:root{--ink:#2D2340;--muted:#594C6B;--pri:#E8590C;--acc:#6741D9;--good:#2B8A3E;--card:#fff;--line:#F1D9C2;--soft:#FFF4E6}
html{font-size:20px;-webkit-text-size-adjust:100%}
html.big{font-size:24px}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#FFF3E0 0%,#FFE8F0 100%) fixed;min-height:100vh;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
button{cursor:pointer;touch-action:manipulation}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:calc(env(safe-area-inset-top) + .4rem) calc(env(safe-area-inset-right) + .8rem) .4rem calc(env(safe-area-inset-left) + .8rem);background:linear-gradient(90deg,#FF922B,#F76707);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.brand{font-weight:800;font-size:1.25rem;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.iconbtn{min-width:3rem;min-height:3rem;border:0;border-radius:50%;background:rgba(255,255,255,.28);color:#fff;font-size:1.4rem}
main{max-width:860px;margin:0 auto;padding:1rem calc(env(safe-area-inset-right) + 1rem) calc(env(safe-area-inset-bottom) + 6.5rem) calc(env(safe-area-inset-left) + 1rem)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:.2rem;background:#fff;border-top:2px solid var(--line);padding:.3rem calc(env(safe-area-inset-right) + .3rem) calc(env(safe-area-inset-bottom) + .3rem) calc(env(safe-area-inset-left) + .3rem)}
nav.bottom button{border:0;background:none;font-size:.85rem;font-weight:700;color:var(--muted);min-height:3.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px}
nav.bottom button span{font-size:1.5rem;line-height:1.1}
nav.bottom button.on{color:var(--pri);background:var(--soft)}
.card{background:var(--card);border-radius:22px;padding:1.1rem 1.2rem;margin:0 0 1rem;box-shadow:0 4px 16px rgba(120,60,20,.10)}
.center{text-align:center}
h1{font-size:1.8rem;margin:.2rem 0 .5rem;line-height:1.2}
h2{font-size:1.4rem;margin:.2rem 0 .6rem;line-height:1.25}
h3{font-size:1.15rem;margin:.2rem 0 .5rem}
p{margin:.4rem 0}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3.1rem;padding:.6rem 1.2rem;border:0;border-radius:18px;font-size:1.05rem;font-weight:700;background:var(--pri);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.alt{background:var(--acc)} .btn.green{background:var(--good)} .btn.blue{background:#1971C2}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1rem}
.row.center{justify-content:center}
.affirm{background:linear-gradient(135deg,#FFE3EC,#FFF0F6);border:2px solid #FFC2D4;border-radius:20px;padding:1rem 1.1rem;font-size:1.15rem;font-weight:600;color:#7A1E48;margin:0 0 1rem}
.quote{background:#FFFDF2;border:2px solid #FFE8A3;border-radius:20px;padding:1rem 1.1rem;font-size:1.1rem;font-style:italic;color:#5C4400;margin:0 0 1rem}
.quote small{display:block;font-style:normal;font-weight:700;font-size:.92rem;margin-top:.35rem;color:#8F5B00}
.tip{background:#EBFBEE;border:2px solid #B2F2BB;border-radius:20px;padding:1rem 1.1rem;color:#1B4D2A;margin:0 0 1rem}
.note{background:#E7F5FF;border:2px solid #A5D8FF;border-radius:20px;padding:1rem 1.1rem;color:#0B3B66;margin:.6rem 0}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.8rem}
.gcard{display:flex;align-items:center;gap:.8rem;text-align:left;width:100%;min-height:5rem;padding:.8rem 1rem;border-radius:20px;border:3px solid transparent;background:#fff;font-size:1rem;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.gcard .ge{font-size:2.1rem;width:3.4rem;height:3.4rem;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.gcard b{display:block;font-size:1.1rem}
.gcard small{display:block;color:var(--muted);font-size:.88rem}
.gcard.done{border-color:#69DB7C;background:#F4FCF5}
.pill{display:inline-block;padding:.15rem .7rem;border-radius:999px;background:#F3F0FF;color:#5F3DC4;font-weight:700;font-size:.9rem}
.pill.gold{background:#FFF3BF;color:#8F5B00}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.stat{background:#FFF9F0;border:2px solid var(--line);border-radius:18px;padding:.8rem;text-align:center}
.stat b{display:block;font-size:1.8rem;color:var(--pri)}
.status{text-align:center;color:var(--muted);font-weight:700;min-height:1.5rem}
.fb{min-height:2.4rem;text-align:center;font-weight:700;font-size:1.15rem;margin:.4rem 0}
.fb.good{color:var(--good)} .fb.soft{color:#A35200}
.ghead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.ghelp{color:var(--muted)}
/* memory */
.mgrid{display:grid;gap:.6rem;max-width:560px;margin:0 auto}
.mcard{aspect-ratio:1/1;min-height:4rem;border:3px solid transparent;border-radius:18px;font-size:2.3rem;background:linear-gradient(135deg,#9775FA,#6741D9);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15);padding:0}
.mcard .front{display:none}
.mcard .back{font-size:1.6rem;opacity:.8}
.mcard.up{background:#fff;border-color:#D0BFFF}
.mcard.up .front{display:inline}.mcard.up .back{display:none}
.mcard.done{background:#EBFBEE;border-color:#69DB7C;animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
/* speed */
.target{text-align:center;font-size:1.3rem;font-weight:700;margin:.4rem 0 .8rem}
.tbig{font-size:3rem;display:inline-block;vertical-align:middle;background:#FFF9DB;border:3px solid #FFE066;border-radius:20px;padding:.1rem .6rem}
.sgrid{display:grid;gap:.6rem;max-width:520px;margin:0 auto}
.scell{aspect-ratio:1/1;min-height:3.6rem;font-size:2.4rem;background:#fff;border:3px solid var(--line);border-radius:18px;padding:0}
.scell.nope{background:#FFF4E6}
.scell.yes{background:#D3F9D8;border-color:#40C057;animation:pop .4s}
.waiting{text-align:center;font-size:1.6rem;font-weight:800;color:var(--acc);padding:2rem 0}
/* simon */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;max-width:400px;margin:0 auto}
.pad{aspect-ratio:1/1;min-height:6rem;border:0;border-radius:30px;opacity:.5;transition:opacity .12s,transform .12s;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.pad.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 28px 8px rgba(255,255,255,.95),0 5px 0 rgba(0,0,0,.2)}
/* words */
.clue{text-align:center;font-size:1.2rem;font-weight:700;color:var(--acc)}
.slots,.tiles{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;margin:1rem 0}
.slot{width:clamp(2.3rem,11vw,3.2rem);height:3.4rem;border-radius:12px;border:3px dashed #B197FC;font-size:1.6rem;font-weight:800;background:#fff;color:var(--ink);padding:0}
.slot.filled{border-style:solid;background:#F3F0FF}
.slot.fixed{background:#EBFBEE;border:3px solid #69DB7C}
.tile{width:clamp(2.6rem,12vw,3.4rem);height:3.4rem;border-radius:14px;border:0;background:#FFD43B;font-size:1.6rem;font-weight:800;color:#5C3D00;box-shadow:0 3px 0 #E8A800;padding:0}
.tile:disabled{opacity:.2}
/* quiz */
.q{font-size:1.35rem;font-weight:700;text-align:center;margin:.6rem 0 1rem}
.seqshow{font-size:2.3rem;text-align:center;line-height:1.5;word-spacing:.3rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.opt{min-height:3.6rem;border-radius:18px;border:3px solid var(--line);background:#fff;font-size:1.15rem;font-weight:700;color:var(--ink);padding:.5rem}
.opts.emoji .opt{font-size:2.4rem;min-height:4.4rem}
.opt.right{background:#D3F9D8;border-color:#40C057}
.opt.miss{background:#FFF4E6;border-color:#FFC078}
/* results */
.stars{font-size:3rem;letter-spacing:.3rem}
.stars .off{filter:grayscale(1);opacity:.3}
.lvl{font-weight:700;color:var(--acc)}
/* wellness */
.breath{width:12rem;height:12rem;border-radius:50%;margin:1rem auto;background:radial-gradient(circle at 35% 35%,#D0EBFF,#4DABF7);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:800;font-size:1.15rem;transform:scale(.62);transition:transform 4s ease-in-out;box-shadow:0 0 40px rgba(77,171,247,.5);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.glasses{display:flex;flex-wrap:wrap;gap:.45rem}
.glass{width:3.2rem;height:3.6rem;font-size:1.8rem;border-radius:14px;border:3px solid #A5D8FF;background:#fff;padding:0;filter:grayscale(1);opacity:.45}
.glass.full{filter:none;opacity:1;background:#E7F5FF}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.6rem}
.food{background:#FFF9F0;border-radius:16px;padding:.7rem;border:2px solid var(--line)}
.food b{display:block}
input[type=text]{width:100%;font-size:1.2rem;padding:.8rem 1rem;border-radius:16px;border:3px solid #FFC078;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--pri)}
input[type=range]{width:100%;height:2.4rem;accent-color:var(--pri)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 0;border-bottom:2px solid #F8EDE3}
.switch{min-width:6rem}
details summary{font-weight:700;font-size:1.05rem;cursor:pointer;padding:.5rem 0;min-height:2.5rem}
ul.tips{padding-left:1.2rem} ul.tips li{margin:.4rem 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem}
.badge{text-align:center;padding:.7rem;border-radius:18px;background:#FFF9DB;border:2px solid #FFE066;font-size:.9rem}
.badge b{display:block;font-size:1rem}
.badge.locked{filter:grayscale(1);opacity:.45;background:#f6f6f6;border-color:#ddd}
.badge .be{font-size:2.2rem}
table.gt{width:100%;border-collapse:collapse}
table.gt td,table.gt th{padding:.5rem .3rem;border-bottom:2px solid #F8EDE3;text-align:left}
.chart svg{width:100%;height:auto}
.hero{font-size:4.5rem;line-height:1;text-align:center}
.step{display:flex;gap:.8rem;align-items:flex-start;margin:.8rem 0;font-size:1.1rem}
.step .num{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.shareicon{display:inline-flex;vertical-align:middle;width:1.6rem;height:1.6rem;border:2px solid #1971C2;border-radius:6px;align-items:center;justify-content:center;color:#1971C2;font-weight:800;font-size:1rem}
#modal{position:fixed;inset:0;background:rgba(40,20,50,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem}
.mbox{background:#fff;border-radius:24px;padding:1.4rem;max-width:480px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:pop .35s}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;width:-webkit-fit-content;top:calc(env(safe-area-inset-top) + 4.5rem);z-index:40;max-width:min(92vw,560px);background:#fff;border:3px solid #FFC2D4;color:#7A1E48;font-weight:700;padding:.8rem 1.1rem;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.18);text-align:center;transition:opacity .4s;opacity:0;pointer-events:none}
#toast.show{opacity:1;pointer-events:auto}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
/* mahjong */
.mjwrap{overflow-x:auto;padding:.3rem 0 .6rem;-webkit-overflow-scrolling:touch}
.mjboard{position:relative;margin:0 auto}
.mjt{position:absolute;padding:0;border-radius:12px;border:2px solid #C9B79C;border-right-width:5px;border-bottom-width:6px;border-right-color:#B08E62;border-bottom-color:#9C7A4E;background:linear-gradient(145deg,#FFFFFF,#FFF4DC);display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:2px 3px 6px rgba(0,0,0,.25);transition:transform .12s}
.mjt span{pointer-events:none}
.mjt.blocked{filter:brightness(.78) saturate(.75)}
.mjt.sel{background:linear-gradient(145deg,#FFF3BF,#FFE066);border-color:#F59F00;transform:translateY(-4px);box-shadow:0 0 0 4px #F59F00,2px 6px 10px rgba(0,0,0,.3)}
.mjt.hint{animation:glow 1s ease-in-out infinite;border-color:#40C057}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px #40C057,2px 3px 6px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 7px #8CE99A,2px 3px 6px rgba(0,0,0,.25)}}
.mjbar{margin:0 0 .6rem}
.btn.pulse{animation:pop 1s infinite}
.btn:disabled{opacity:.45}
/* feather friends */
.btools{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:0 0 .7rem}
.mjtools{grid-template-columns:1fr 1fr 1fr}
.btools .btn{min-height:3rem;padding:.45rem .5rem;font-size:1rem}
.bboard{--bs:44px;display:grid;grid-template-columns:1fr 1fr;gap:.9rem .5rem;padding:.9rem 10px;border-radius:22px;background:linear-gradient(90deg,#8D5B3A 0 8px,transparent 8px calc(100% - 8px),#8D5B3A calc(100% - 8px)),linear-gradient(180deg,#D0EBFF,#E6FCF5);max-width:700px;margin:0 -.85rem}
@media (min-width:760px){.bboard{margin:0 auto}}
.branch{position:relative;border:0;background:none;padding:0 0 .2rem;min-height:calc(var(--bs) + 22px);display:flex;flex-direction:column;justify-content:flex-end;border-radius:16px;touch-action:manipulation}
.branch .perch{display:flex;align-items:flex-end;min-height:var(--bs);padding:0 calc(var(--bs) * 0.13 + 2px)}
.branch.R .perch{flex-direction:row-reverse}
.branch .bar{display:block;height:11px;border-radius:8px;background:linear-gradient(180deg,#B07A4F,#7A4B2A);box-shadow:0 2px 0 rgba(0,0,0,.15);position:relative}
.branch.L .bar{margin-right:10%;border-top-left-radius:0;border-bottom-left-radius:0}
.branch.R .bar{margin-left:10%;border-top-right-radius:0;border-bottom-right-radius:0}
.branch.L .bar::after,.branch.R .bar::after{content:"";position:absolute;top:-7px;width:16px;height:10px;background:#51CF66;border-radius:0 100% 0 100%}
.branch.L .bar::after{right:-8px}.branch.R .bar::after{left:-8px;transform:scaleX(-1)}
.branch.sel{background:rgba(255,255,255,.55);box-shadow:0 0 0 3px #FAB005}
.branch.hint{animation:glow 1s ease-in-out infinite;background:rgba(235,251,238,.7)}
.bird{display:block;flex:none;width:var(--bs);height:var(--bs);margin:0 calc(var(--bs) * -0.13);transition:transform .18s;position:relative}
.bird svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.bird.up{transform:translateY(-9px)}
.bird.hop{animation:hop .35s}
.bird.fly{animation:flyaway 1s ease-in forwards}
@keyframes hop{0%{transform:translateY(-14px) scale(.9)}60%{transform:translateY(2px)}100%{transform:none}}
@keyframes flyaway{0%{transform:none;opacity:1}30%{transform:translateY(-12px) rotate(-8deg)}100%{transform:translate(30px,-220px) rotate(12deg) scale(.6);opacity:0}}
[hidden]{display:none!important}
@media (max-width:420px){html{font-size:19px} html.big{font-size:22px} .card{padding:1rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="homeBtn" aria-label="Home">🏠</button>
  <div class="brand">☀️ Bright Mind</div>
  <button class="iconbtn" id="soundBtn" aria-label="Sound on or off">🔊</button>
</header>
<main id="app" aria-live="polite"></main>
<nav class="bottom" id="nav">
  <button data-nav="home"><span>🏠</span>Home</button>
  <button data-nav="wellness"><span>🌿</span>Wellness</button>
  <button data-nav="progress"><span>📈</span>Progress</button>
  <button data-nav="settings"><span>⚙️</span>Settings</button>
</nav>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<canvas id="confetti"></canvas>
<script src="messages.js"></script>
<script src="trivia.js"></script>
<script>
"use strict";
/* ============ Content ============ */
const TIPS=[
"Aim for 7 to 8 hours of sleep. Sleep helps your brain sort and store memories.",
"Going to bed and waking up at the same time each day helps your body clock and your mood.",
"Wind down before bed: dim the lights and set screens aside about an hour before sleep.",
"Chatting with friends and family is wonderful brain exercise. Why not call someone you love today?",
"Joining a club, class, or group keeps you connected. Staying social is linked with healthier aging.",
"Share a meal with someone. Good conversation keeps the mind lively.",
"A brisk walk of 20 to 30 minutes on most days gets blood flowing to your brain.",
"Gentle movement like stretching, tai chi, or chair yoga helps balance, mood, and focus.",
"Dancing mixes music, movement, and memory: a triple treat for your brain!",
"Short walks count too. Try a little stroll after a meal.",
"Learning something new, like a language, an instrument, or a craft, builds new brain connections.",
"Try doing an everyday task a new way, like taking a different route on your walk.",
"Reading a little every day keeps your vocabulary and imagination strong.",
"Each evening, think of three good things from your day. Gratitude lifts the mood.",
"Write a short thank-you note to someone. It brightens two days: theirs and yours!",
"When you feel tense, try slow breathing: in for 4, out for 6. It calms the body.",
"Take a few quiet minutes to notice what you can see, hear, and feel. That's mindfulness.",
"Step outside for some daylight. Morning light helps both sleep and mood.",
"Ongoing stress is hard on memory. Gentle breathing, walks, and laughter all help.",
"It's okay to rest and say no sometimes. Taking care of yourself matters.",
"Laughter really is good for you. Watch a funny show or share a joke with a friend.",
"Hobbies like gardening, knitting, painting, or puzzles keep both hands and mind busy.",
"Gardening gives you fresh air, gentle exercise, and something lovely to care for.",
"Cooking a new recipe is fun exercise for planning and memory.",
"Listening to music you love can lift your mood and bring back happy memories.",
"Singing along to your favorite songs is great for breathing, memory, and joy.",
"Playing or learning an instrument is excellent brain exercise at any age.",
"Keep a calendar or notebook handy. Writing things down frees your mind to focus.",
"Regular hearing and vision checkups help you stay engaged with the world around you.",
"Variety is the spice of brain health: mix up your puzzles, activities, and conversations.",
"Be kind to yourself. Forgetting a name now and then happens to everyone.",
"Volunteering brings purpose and connection, two lovely gifts for your wellbeing.",
"Regular checkups with your doctor help keep blood pressure and blood sugar healthy, which is good for your brain too.",
"A few minutes of puzzles every day adds up. Little and often is the secret!",
"Spending time in nature, even a park bench or a garden, can lower stress and refresh the mind."
];
const NUTRITION=[
["🥬","Leafy greens","Spinach, kale, and lettuce are brain superstars. Try a serving most days."],
["🫐","Berries","Blueberries and strawberries are full of antioxidants. Enjoy them a few times a week."],
["🥜","Nuts","A small handful of nuts makes a great brain-healthy snack."],
["🐟","Fish","Salmon, sardines, or trout once or twice a week give you healthy omega-3 fats."],
["🫒","Olive oil","Cook with olive oil instead of butter when you can."],
["🌾","Whole grains","Oatmeal, brown rice, and whole-wheat bread give steady energy."],
["🫘","Beans & lentils","Full of fiber and protein. Lovely in soups and salads."],
["🥦","Colorful veggies","Try to eat a rainbow of vegetables every day."],
["🍗","Poultry","Chicken or turkey is a lean choice a couple of times a week."]
];
const LIMITS="Go easy on sweets, sugary drinks, fried foods, fast food, red and processed meats, butter, and cheese. Enjoy them as occasional treats.";
const WATER_TIPS=[
"Your brain is mostly water! Even mild dehydration can make you feel tired or foggy.",
"As we get older we don't always feel thirsty, so sip water regularly through the day.",
"Keep a glass or bottle of water where you can see it as a friendly reminder.",
"Watermelon, cucumber, oranges, and soups count toward your fluids too.",
"Herbal tea counts toward your daily fluids as well.",
"Try a glass of water with each meal and one between meals."
];
const DOCTOR_NOTE="These are general healthy-living tips. Always follow your own doctor's advice, especially about how much fluid is right for you, your diet, and any medications.";
const PRAISE=["Wonderful, {n}!","Brilliant!","You got it, {n}!","Fantastic!","Look at you go, {n}!","Superb!","That's right! 🌟","Beautiful work, {n}!","Sharp as a tack!","Yes! Well done!","Marvelous, {n}!","Spot on! ✨"];

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a,r){r=r||Math.random;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function N(){return esc(S.name||"friend")}

/* Shuffled no-repeat rotation, remembered between visits */
function rotNext(key,len){
  if(!S.rot||typeof S.rot!=="object")S.rot={};
  let r=S.rot[key];
  if(!r||r.n!==len||!Array.isArray(r.q)||!r.q.length){
    const last=r?r.last:null;const q=shuffle(Array.from({length:len},(_,i)=>i));
    if(q.length>1&&q[0]===last)q.push(q.shift());
    r=S.rot[key]={n:len,q:q,last:null};
  }
  const i=r.q.shift();r.last=i;save();return i;
}

const sfx=(function(){
  let ctx=null,master=null;
  function get(){
    if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
      try{ctx=new C();master=ctx.createGain();master.connect(ctx.destination)}catch(e){ctx=null;return null}}
    applyVol();
    if(ctx.state!=="running"){try{ctx.resume()}catch(e){}}
    return ctx;
  }
  function applyVol(){if(master)master.gain.value=S.set.muted?0:S.set.vol}
  function unlock(){const c=get();if(!c)return;try{const b=c.createBuffer(1,1,22050);const s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}catch(e){}}
  function tone(f,t0,dur,type,vol,f2){
    if(S.set.muted)return;const c=get();if(!c)return;
    try{const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";const st=c.currentTime+0.02+t0;
      o.frequency.setValueAtTime(f,st);if(f2)o.frequency.exponentialRampToValueAtTime(f2,st+dur*0.8);
      g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(vol||0.2,st+0.015);g.gain.exponentialRampToValueAtTime(0.0001,st+dur);
      o.connect(g);g.connect(master);o.start(st);o.stop(st+dur+0.05)}catch(e){}
  }
  return{unlock,applyVol,
    pop(){tone(520,0,0.1,"sine",0.22,900)},
    chime(){[1046.5,1318.5,1568].forEach((f,i)=>tone(f,i*0.08,0.4,"triangle",0.2))},
    sparkle(){[1568,1760,2093,2349,2637,3136].forEach((f,i)=>tone(f,i*0.05,0.3,"sine",0.12))},
    levelup(){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*0.08,0.22,"square",0.06));[2093,2637,3136,4186].forEach((f,i)=>tone(f,0.42+i*0.05,0.3,"sine",0.08))},
    fanfare(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*0.13,0.24,"triangle",0.22));[523.25,659.25,783.99,1046.5].forEach(f=>tone(f,0.58,1.0,"triangle",0.11));[2093,2637,3136,2637,3136].forEach((f,i)=>tone(f,0.65+i*0.07,0.3,"sine",0.06))},
    soft(){tone(440,0,0.25,"sine",0.1);tone(392,0.14,0.35,"sine",0.09)},
    note(f,d){tone(f,0,d||0.4,"triangle",0.26)},
    bubble(){tone(380,0,0.14,"sine",0.22,900);tone(620,0.11,0.14,"sine",0.16,1300)},
    chirp(n){for(let i=0;i<(n||1);i++){tone(2300+i*250,i*0.11,0.07,"sine",0.11,3300+i*200);tone(2900+i*250,i*0.11+0.06,0.06,"sine",0.08,2400)}},
    chirpSong(){[0,0.12,0.24,0.42,0.54].forEach((t,i)=>tone(2200+(i%3)*400,t,0.08,"sine",0.12,3400+(i%2)*300));[1568,2093,2637].forEach((f,i)=>tone(f,0.7+i*0.07,0.3,"triangle",0.1))},
    flap(){tone(260,0,0.07,"triangle",0.07,520);tone(300,0.08,0.07,"triangle",0.06,560)},
    breathe(up){tone(up?261.63:329.63,0,1.6,"sine",0.07,up?329.63:261.63)}
  };
})();

function confetti(count){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#confetti"),c=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;c.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#FF922B","#F06595","#FCC419","#51CF66","#339AF0","#845EF7"],shapes=["⭐","💖","✨"];
  const P=[];for(let i=0;i<(count||110);i++)P.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*3.5,r:Math.random()*6.28,vr:(Math.random()-0.5)*0.2,s:6+Math.random()*8,c:rnd(cols),e:Math.random()<0.18?rnd(shapes):null});
  const start=performance.now();
  (function frame(now){const el=now-start;c.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.03;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=el>2600?Math.max(0,1-(el-2600)/700):1;
      if(p.e){c.font=(p.s*2.4)+"px sans-serif";c.fillText(p.e,0,0)}else{c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}c.restore()});
    if(el<3300)requestAnimationFrame(frame);else c.clearRect(0,0,innerWidth,innerHeight)})(start);
}

/* ============ Progress logic ============ */
function gstat(id){return S.games[id]||(S.games[id]={best:0,plays:0,level:1})}
function streak(){const set=new Set(S.days);const d=new Date();if(!set.has(today(d)))d.setDate(d.getDate()-1);let s=0;while(set.has(today(d))){s++;d.setDate(d.getDate()-1)}return s}
function dailyIds(){const r=seeded("bm"+today());return shuffle(GAMES.map(g=>g.id),r).slice(0,3)}
function doneToday(){return S.workout[today()]||[]}
function waterToday(){return S.water[today()]||0}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function improvement(){
  const h=S.hist;if(h.length<6)return null;
  const k=Math.min(5,Math.floor(h.length/2));
  const first=avg(h.slice(0,k).map(x=>x.p)),last=avg(h.slice(-k).map(x=>x.p));
  return Math.round((last-first)/Math.max(first,1)*100);
}
function improvementMsg(){
  const p=improvement();
  if(p===null){const left=6-S.hist.length;return `Play ${left} more game${left===1?"":"s"} and I'll show you how much you're improving, ${N()}! 🌱`}
  if(p>0)return `🎉 You've improved <b>${p}%</b> since you started, ${N()}! Your brain is getting stronger.`;
  if(p===0)return `You're holding steady and strong, ${N()}! Steady practice is exactly what keeps a mind bright. 💪`;
  return `Your games have been a bit more challenging lately (the levels go up as you improve!). Every game you play is good exercise, ${N()}. 💛`;
}
function award(id,list){if(!S.badges[id]){S.badges[id]=today();list.push(id)}}
function checkBadges(ctx){
  const L=[];const n=S.hist.length,st=streak();
  if(n>=1)award("first",L);if(n>=10)award("g10",L);if(n>=25)award("g25",L);if(n>=50)award("g50",L);if(n>=100)award("g100",L);
  if(GAMES.every(g=>gstat(g.id).plays>0))award("explorer",L);
  if(st>=3)award("s3",L);if(st>=7)award("s7",L);if(st>=30)award("s30",L);
  if(ctx&&ctx.pb)award("pb",L);if(ctx&&ctx.perfect)award("perfect",L);
  if(dailyIds().every(id=>doneToday().includes(id)))award("workout",L);
  if(gstat("mahjong").plays>0)award("mahjong",L);
  if(S.hist.some(h=>h.g==="mahjong"&&h.l>=3))award("mahjong3",L);
  if(gstat("birds").plays>0)award("birds",L);
  if(S.hist.some(h=>h.g==="birds"&&h.l>=3))award("birds3",L);
  if(S.tplayed&&TRIVIA_CATS.every(c=>S.tplayed[c.id]))award("trivia4",L);
  if(GAMES.some(g=>gstat(g.id).level>=5))award("lvl5",L);
  if(waterToday()>=8)award("water",L);
  return L;
}
function badgeHTML(ids){return ids.map(id=>{const b=BADGES.find(x=>x.id===id);return `<div class="badge"><div class="be">${b.e}</div><b>${b.n}</b>${b.d}</div>`}).join("")}

function chartSVG(){
  const byDay={};S.hist.forEach(h=>{(byDay[h.d]=byDay[h.d]||[]).push(h.p)});
  let pts=Object.keys(byDay).sort().slice(-14).map(d=>({label:d.slice(5).replace("-","/"),v:Math.round(avg(byDay[d]))}));
  let title="Average points per day";
  if(pts.length<2){pts=S.hist.slice(-12).map((h,i)=>({label:"#"+(S.hist.length-Math.min(12,S.hist.length)+i+1),v:h.p}));title="Points per game"}
  if(pts.length<2)return `<p class="muted">Play a couple of games and your progress chart will appear here! 📈</p>`;
  const W=640,H=280,L=46,R=16,T=20,B=44,max=Math.max(100,...pts.map(p=>p.v))*1.1;
  const x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>T+(H-T-B)*(1-v/max);
  let g="";[0,50,100,150,200].filter(v=>v<=max).forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#F1D9C2" stroke-width="2"/><text x="${L-8}" y="${y(v)+6}" font-size="16" text-anchor="end" fill="#594C6B">${v}</text>`});
  const line=pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ");
  const area=`${x(0)},${y(0)} ${line} ${x(pts.length-1)},${y(0)}`;
  const step=Math.ceil(pts.length/7);
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="7" fill="#F76707" stroke="#fff" stroke-width="3"/>`+(i%step===0||i===pts.length-1?`<text x="${x(i)}" y="${H-14}" font-size="16" text-anchor="middle" fill="#594C6B">${p.label}</text>`:"")).join("");
  return `<p class="muted">${title}</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">${g}<polygon points="${area}" fill="rgba(255,146,43,.18)"/><polyline points="${line}" fill="none" stroke="#F76707" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}

function finishGame(id,level,res){
  const g=GMAP[id],gs=gstat(id);
  res.norm=clamp(Math.round(res.norm),0,100);
  const pts=Math.round(res.norm*(1+(level-1)*0.25));
  const pb=gs.plays>0&&pts>gs.best;

  let lvlMsg="",lvlUp=false;
  if(!g.fixed){
    if(res.norm>=75&&gs.level<5){gs.level++;lvlUp=true;lvlMsg=`🚀 You're ready for a little more challenge: Level ${gs.level} next time!`}
    else if(res.norm<40&&gs.level>1){gs.level--;lvlMsg=`🌱 We'll make the next round a little gentler. You're doing great!`}
  }
  S.hist.push({d:today(),t:Date.now(),g:id,n:res.norm,p:pts,l:level});
  if(S.hist.length>2000)S.hist.splice(0,S.hist.length-2000);
  if(!S.days.includes(today()))S.days.push(today());

/* ============ Games ============ */
const GAMEFN={};

GAMEFN.memory=function(level,done){
  const pairs=[3,4,6,8,8][level-1],cols=pairs===3?3:4,area=$("#area");
  const icons=shuffle(MEM_ICONS).slice(0,pairs),deck=shuffle(icons.concat(icons));
  area.innerHTML=`<div class="mgrid" style="grid-template-columns:repeat(${cols},1fr);max-width:${cols*130}px">`+deck.map((e,i)=>`<button class="mcard" data-i="${i}" aria-label="Card ${i+1}"><span class="front">${e}</span><span class="back">❔</span></button>`).join("")+"</div>";
  let first=null,lock=false,moves=0,matched=0;
  const upd=()=>status(`Pairs found: ${matched} of ${pairs} · Turns: ${moves}`);upd();
  area.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains("up"))return;sfx.pop();b.classList.add("up");
    if(!first){first=b;return}
    moves++;const a=first;first=null;
    if(deck[a.dataset.i]===deck[b.dataset.i]){matched++;a.classList.add("done");b.classList.add("done");sfx.chime();goodFb();
      if(matched===pairs){later(()=>done({norm:100*pairs*1.4/moves,detail:`You found all ${pairs} pairs in ${moves} turns!`}),1000)}}
    else{lock=true;fb(rnd(["Not a match, but now you know where those are! 🧠","Good try! Remember those spots.","Ooh, close! Keep those in mind."]),"soft");
      later(()=>{a.classList.remove("up");b.classList.remove("up");lock=false},level>=4?900:1200)}
    upd();
  });
};

GAMEFN.speed=function(level,done){
  const n=[4,6,9,12,16][level-1],cols=n<=4?2:n<=9?3:4,set=SPEED_SETS[level>=4?1:0],rounds=10,area=$("#area");
  const base=700+n*90;let r=0;const times=[];
  function round(){
    if(r>=rounds){const a=avg(times);return done({norm:100-(a-base)/30,detail:`Your average find time was ${(a/1000).toFixed(1)} seconds over ${rounds} rounds. Speedy!`})}
    r++;status(`Round ${r} of ${rounds}`);

function mcq(q,ans,wrongs,ex,fmt){fmt=fmt||(x=>x);const opts=shuffle([ans].concat(wrongs.slice(0,3)));return{q,opts:opts.map(fmt),a:opts.indexOf(ans),ex}}

function mathQ(level){
  const types=[["add","sub"],["add","sub","pat","mul"],["add2","sub2","mul","pat","money"],["add2","mul","pat","pat2","money","div"],["two","mul2","pat2","money","div","pat"]][level-1];

  if(t==="add"){const x=ri(2,12),y=ri(2,9);q=`${x} + ${y} = ?`;a=x+y}
  else if(t==="sub"){const x=ri(8,20),y=ri(2,x-2);q=`${x} − ${y} = ?`;a=x-y}
  else if(t==="add2"){const x=ri(12,60),y=ri(11,39);q=`${x} + ${y} = ?`;a=x+y}
  else if(t==="sub2"){const x=ri(40,99),y=ri(11,x-10);q=`${x} − ${y} = ?`;a=x-y}
  else if(t==="mul"){const x=ri(2,9),y=ri(2,10);q=`${x} × ${y} = ?`;a=x*y;d=[-x,x,-1,1,y,-y]}
  else if(t==="mul2"){const x=ri(11,15),y=ri(3,9);q=`${x} × ${y} = ?`;a=x*y;d=[-x,x,-y,y,10,-10]}

    const s=ri(45,70),st=ri(3,8);const seq=[0,1,2,3].map(k=>s-k*st);q=`What number comes next?<br><span class="seqshow">${seq.join(", ")}, ?</span>`;a=s-4*st;return mcq(q,a,numWrongs(a,[-1,1,st,-st,2]),`(Taking away ${st} each time.)`)}

    q=`You buy ${item} for $${(p/100).toFixed(2)} and pay with a $${pay/100} bill. How much change do you get?`;a=pay-p;
    return mcq(q,a,numWrongs(a,[-25,25,-50,50,100,-100]),"",v=>"$"+(v/100).toFixed(2))}
  return mcq(q,a,numWrongs(a,d),"");
}

/* Trivia: category picker, level-based difficulty, no repeats until a topic's questions are all used */
function qid(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
const TV_WANT={1:[1],2:[1,2],3:[2],4:[2,3],5:[3]};
function triviaPick(cat,level,n){
  if(!S.tseen||typeof S.tseen!=="object")S.tseen={};
  const want=TV_WANT[level]||[1];
  const dist=d=>Math.min(...want.map(w=>Math.abs(w-d)));
  const cats=cat==="mixed"?TRIVIA_CATS.map(c=>c.id):[cat];
  const lists={};
  cats.forEach(c=>{
    let seen=new Set(S.tseen[c]||[]);
    const all=TRIVIA_Q[c].map(q=>({c:c,id:qid(q[0]),q:q}));
    let un=all.filter(x=>!seen.has(x.id));
    const need=cat==="mixed"?Math.ceil(n/cats.length)+1:n;
    if(un.length<need){S.tseen[c]=[];un=all}
    // closest difficulty first, random within the same difficulty
    lists[c]=shuffle(un).sort((a,b)=>dist(a.q[2])-dist(b.q[2]));
  });
  const out=[];let k=0;const order=shuffle(cats);
  while(out.length<n&&k<500){const c=order[k%order.length];const x=lists[c].shift();if(x)out.push(x);k++}
  out.forEach(x=>{(S.tseen[x.c]=S.tseen[x.c]||[]).push(x.id)});
  save();
  return shuffle(out);
}
function triviaLeft(c){const seen=new Set(S.tseen&&S.tseen[c]||[]);return TRIVIA_Q[c].filter(q=>!seen.has(qid(q[0]))).length}

  ["########","########","########","########","########"],
  ["#########","#########","###...###","###...###","#########"]

/* Per level: which shapes, how many layers at most, tile count range, random board size */
const MJ_LEVELS=[
 {sh:["s"],z:2,zmin:1,min:16,max:26,rw:[5,6],rh:[4,4]},
 {sh:["s","m"],z:3,zmin:2,min:24,max:36,rw:[6,7],rh:[4,5]},
 {sh:["m","l"],z:3,zmin:2,min:38,max:56,rw:[7,8],rh:[5,5]},

function mjGrid(rows){const g=[];rows.forEach((r,y)=>r.split("").forEach((c,x)=>{if(c==="#")g.push(x+","+y)}));return new Set(g)}
/* Stack layers: a spot gets a tile above if the tile below has neighbours on both sides and above or below it */
function mjStack(base,maxZ,keep,strict){
  const layers=[base];
  for(let z=1;z<maxZ;z++){
    const prev=layers[z-1],next=new Set();
    prev.forEach(k=>{const[x,y]=k.split(",").map(Number);
      const up=prev.has(x+","+(y-1)),dn=prev.has(x+","+(y+1));
      if(prev.has((x-1)+","+y)&&prev.has((x+1)+","+y)&&(strict?(up&&dn):(up||dn)))next.add(k)});
    const out=keep?keep(next,z):next;
    if(!out.size)break;layers.push(out);
  }
  const pos=[];layers.forEach((L,z)=>L.forEach(k=>{const[x,y]=k.split(",").map(Number);pos.push({x,y,z})}));

function mjEven(pos){

  const top=Math.max(...pos.map(p=>p.z)),cand=pos.filter(p=>p.z===top);
  const W=Math.max(...pos.map(p=>p.x)),H=Math.max(...pos.map(p=>p.y));
  cand.sort((a,b)=>(Math.abs(a.x-W/2)+Math.abs(a.y-H/2))-(Math.abs(b.x-W/2)+Math.abs(b.y-H/2)));

/* A brand-new random layered board, mirrored left-to-right so it looks tidy */
function mjRandomLayout(cfg){
  for(let t=0;t<200;t++){
    const W=ri(cfg.rw[0],cfg.rw[1]),H=ri(cfg.rh[0],cfg.rh[1]),base=new Set();
    for(let y=0;y<H;y++)for(let x=0;x<Math.ceil(W/2);x++){
      const edge=(x===0)+(y===0||y===H-1);
      if(Math.random()<(edge===2?0.45:edge===1?0.78:0.94)){base.add(x+","+y);base.add((W-1-x)+","+y)}

    if(pos.length>=cfg.min&&pos.length<=cfg.max&&Math.max(...pos.map(p=>p.z))+1>=cfg.zmin)return pos;
  }

}
function mjShapeLayout(cfg){
  const opts=[];cfg.sh.forEach(s=>MJ_SHAPES[s].forEach(r=>opts.push(r)));
  for(const rows of shuffle(opts)){
    let r=rows.slice();if(Math.random()<0.5)r=r.slice().reverse();
    for(let z=cfg.z;z>=cfg.zmin;z--)for(const st of [false,true]){const pos=mjEven(mjStack(mjGrid(r),z,null,st));if(pos.length>=cfg.min&&pos.length<=cfg.max&&Math.max(...pos.map(p=>p.z))+1>=Math.min(z,cfg.zmin+1))return pos}

function mjPositions(level){
  const cfg=MJ_LEVELS[clamp(level,1,5)-1];
  let pos=(Math.random()<0.5?mjRandomLayout(cfg):null)||mjShapeLayout(cfg)||mjRandomLayout(cfg);
  const W=Math.max(...pos.map(p=>p.x))+1,H=Math.max(...pos.map(p=>p.y))+1;
  // Portrait screens: turn the layout sideways so tiles can be bigger
  if(window.innerHeight>window.innerWidth*1.1&&W>H)return pos.map(p=>({x:p.y,y:p.x,z:p.z}));
  return pos;
}
function mjKey(x,y,z){return x+","+y+","+z}
function mjFreeIn(occ,p){return !occ.has(mjKey(p.x,p.y,p.z+1))&&(!occ.has(mjKey(p.x-1,p.y,p.z))||!occ.has(mjKey(p.x+1,p.y,p.z)))}
/* Plan a full removal order of the given positions, two free tiles at a time. Assigning each pair a symbol along this order guarantees a solvable deal. */
function mjPlan(pos){
  for(let attempt=0;attempt<500;attempt++){
    const occ=new Set(pos.map(p=>mjKey(p.x,p.y,p.z)));let alive=pos.slice();const pairs=[];let ok=true;
    while(alive.length){
      const free=alive.filter(p=>mjFreeIn(occ,p));
      if(free.length<2){ok=false;break}
      const a=rnd(free);let rest=free.filter(p=>p!==a);
      // prefer partners not directly beside each other on the same row, so more of the board opens up
      const b=rnd(rest);
      pairs.push([a,b]);[a,b].forEach(p=>occ.delete(mjKey(p.x,p.y,p.z)));alive=alive.filter(p=>p!==a&&p!==b);
    }
    if(ok)return pairs;
  }
  return null;
}
GAMEFN.mahjong=function(level,done){
  const area=$("#area");
  let tiles=[],sel=null,undo=[],hints=0,shuffles=0,undos=0,finished=false;
  let pos,plan=null;for(let t=0;t<20&&!plan;t++){pos=mjPositions(level);plan=mjPlan(pos)}
  const nPairs=pos.length/2,nSym=Math.min(MJ_SYMBOLS.length,level===1?nPairs:level===2?Math.ceil(nPairs*0.85):Math.ceil(nPairs*0.72));
  const syms=shuffle(MJ_SYMBOLS).slice(0,nSym);
  const pairSyms=shuffle(Array.from({length:nPairs},(_,i)=>syms[i%nSym]));
  plan.forEach((pr,i)=>pr.forEach(p=>tiles.push({x:p.x,y:p.y,z:p.z,s:pairSyms[i],alive:true})));
  const W=Math.max(...tiles.map(t=>t.x))+1,H=Math.max(...tiles.map(t=>t.y))+1,maxZ=Math.max(...tiles.map(t=>t.z));
  area.innerHTML=`<div class="btools mjtools mjbar"><button class="btn alt" id="mjHint">💡 Hint</button><button class="btn blue" id="mjShuf">🔀 Shuffle</button><button class="btn ghost" id="mjUndo">↩️ Undo</button></div><div class="mjwrap"><div class="mjboard" id="mjBoard"></div></div>`;
  const board=$("#mjBoard");
  tiles.forEach((t,i)=>{const b=document.createElement("button");b.className="mjt";b.dataset.i=i;b.innerHTML=`<span>${t.s}</span>`;b.setAttribute("aria-label","Tile "+t.s);b.onclick=()=>tap(t);t.el=b;board.appendChild(b)});
  function occ(){return new Set(tiles.filter(t=>t.alive).map(t=>mjKey(t.x,t.y,t.z)))}
  function isFree(t,o){return mjFreeIn(o||occ(),t)}
  function size(){
    const wrapW=Math.min(area.clientWidth||320,860);
    const land=window.innerWidth>window.innerHeight;
    const availH=Math.max(300,window.innerHeight-(land?120:250));
    let w=Math.min(wrapW/(W+0.25+maxZ*0.08),availH/((H+0.25)*1.2),88);
    w=Math.max(30,Math.floor(w));const h=Math.round(w*1.2),d=Math.max(3,Math.round(w*0.09));
    board.style.width=(W*w+maxZ*d+8)+"px";board.style.height=(H*h+maxZ*d+10)+"px";
    tiles.forEach(t=>{const s=t.el.style;s.width=w+"px";s.height=h+"px";s.left=(t.x*w+(maxZ-t.z)*d)+"px";s.top=(t.y*h+(maxZ-t.z)*d)+"px";s.zIndex=t.z*100+t.y+1;s.fontSize=Math.round(w*0.6)+"px"});
  }
  function refresh(){
    const o=occ();
    tiles.forEach(t=>{t.el.hidden=!t.alive;t.el.classList.toggle("blocked",t.alive&&!isFree(t,o));t.el.classList.toggle("sel",t===sel)});
    const left=tiles.filter(t=>t.alive).length;status(`Tiles left: ${left} of ${tiles.length}`);
    $("#mjUndo").disabled=!undo.length;
    if(left&&!findPair()){fb(`No open matches right now, ${N()}. Tap <b>🔀 Shuffle</b> to mix the tiles. You're doing great!`,"soft");$("#mjShuf").classList.add("pulse")}
    else $("#mjShuf").classList.remove("pulse");
  }
  function findPair(){const o=occ(),free=tiles.filter(t=>t.alive&&isFree(t,o)),seen={};
    for(const t of free){if(seen[t.s])return[seen[t.s],t];seen[t.s]=t}return null}
  function clearHint(){tiles.forEach(t=>t.el.classList.remove("hint"))}
  function tap(t){
    if(finished||!t.alive)return;
    if(!isFree(t)){sfx.soft();fb("That tile is tucked in. Try a bright one that's open on a side. 😊","soft");return}
    if(sel===t){sel=null;sfx.pop();refresh();return}
    if(sel&&sel.s===t.s){
      sel.alive=false;t.alive=false;undo.push([sel,t]);sel=null;clearHint();sfx.chime();goodFb();
      refresh();
      if(tiles.every(x=>!x.alive)){finished=true;later(()=>done({norm:Math.max(40,100-Math.round(45*hints/(tiles.length/2))-shuffles*5-undos),detail:`You cleared all ${tiles.length} tiles!${hints?` (${hints} hint${hints>1?"s":""} used)`:""}`}),900)}
      return;
    }
    if(sel)fb("Those two don't match. Look for another "+t.s,"soft");
    sel=t;sfx.pop();refresh();
  }
  $("#mjHint").onclick=()=>{const p=findPair();clearHint();if(!p){fb("No open matches. Let's tap Shuffle! 🔀","soft");return}
    hints++;p.forEach(t=>t.el.classList.add("hint"));sfx.sparkle();fb(`Here's a match: look for the glowing ${p[0].s} tiles! ✨`)};
  $("#mjUndo").onclick=()=>{const u=undo.pop();if(!u)return;u.forEach(t=>t.alive=true);undos++;sel=null;clearHint();fb("Tiles back in place. 👍");refresh()};
  $("#mjShuf").onclick=()=>{
    const live=tiles.filter(t=>t.alive);if(live.length<2)return;
    const pl=mjPlan(live);if(!pl){fb("Hmm, let's try that shuffle once more.","soft");return}
    const counts={};live.forEach(t=>counts[t.s]=(counts[t.s]||0)+1);
    const ps=[];Object.keys(counts).forEach(s=>{for(let k=0;k<counts[s]/2;k++)ps.push(s)});
    const sh=shuffle(ps);pl.forEach((pr,i)=>pr.forEach(t=>{t.s=sh[i];t.el.innerHTML=`<span>${t.s}</span>`;t.el.setAttribute("aria-label","Tile "+t.s)}));
    shuffles++;sel=null;clearHint();undo=[];sfx.sparkle();fb("All mixed up, and there's always a way to finish! 🔀");refresh();
  };
  size();refresh();if(window.innerHeight<900)later(()=>{const bar=$(".mjbar");if(bar)window.scrollTo({top:bar.getBoundingClientRect().top+window.scrollY-70,behavior:"smooth"})},400);fb(`Find two matching open tiles, ${N()}. Take all the time you like. 😊`);
  const onR=()=>{if(!board.isConnected){window.removeEventListener("resize",onR);return}size()};
  window.addEventListener("resize",onR);
};

/* ===== Feather Friends: an original color-sorting puzzle with round, cheerful birds ===== */
/* Colorblind-friendly palette (Okabe-Ito), and every color also wears its own belly shape. */
const BIRD_COLORS=[
 {c:"#E69F00",n:"orange",m:"circle",k:"#2D2340"},
 {c:"#56B4E9",n:"sky blue",m:"star",k:"#2D2340"},
 {c:"#009E73",n:"green",m:"heart",k:"#FFFFFF"},
 {c:"#F0E442",n:"yellow",m:"triangle",k:"#2D2340"},
 {c:"#0072B2",n:"blue",m:"square",k:"#FFFFFF"},
 {c:"#D55E00",n:"red-orange",m:"diamond",k:"#FFFFFF"},
 {c:"#CC79A7",n:"pink",m:"plus",k:"#2D2340"}
];
const BIRD_LEVELS=[{k:3,cap:4},{k:4,cap:4},{k:5,cap:4},{k:6,cap:4},{k:7,cap:4}];
const BIRD_MARK={
 circle:'<circle r="4.6"/>',
 star:'<polygon points="0,-6 1.8,-2 6,-1.9 2.8,1 3.7,5.3 0,3.1 -3.7,5.3 -2.8,1 -6,-1.9 -1.8,-2"/>',
 heart:'<path d="M0,5.2 C-7,0.6 -5.6,-5.4 -2.6,-5.4 C-1.2,-5.4 -0.4,-4.6 0,-3.6 C0.4,-4.6 1.2,-5.4 2.6,-5.4 C5.6,-5.4 7,0.6 0,5.2Z"/>',
 triangle:'<polygon points="0,-5.6 5.6,4.4 -5.6,4.4"/>',
 square:'<rect x="-4.3" y="-4.3" width="8.6" height="8.6" rx="1"/>',
 diamond:'<polygon points="0,-6.2 5,0 0,6.2 -5,0"/>',
 plus:'<path d="M-1.9,-5.6h3.8v3.7h3.7v3.8h-3.7v3.7h-3.8v-3.7h-3.7v-3.8h3.7z"/>'
};
function birdSVG(ci,flip){
  const b=BIRD_COLORS[ci];
  return `<svg viewBox="-25 -25 50 50" aria-hidden="true"><g transform="scale(${flip?-1:1},1)">
  <polygon points="-14,2 -24,-5 -22,8" fill="${b.c}" stroke="rgba(0,0,0,.3)" stroke-width="1.2"/>
  <path d="M-2,-15 q1,-8 6,-5 M2,-15 q4,-6 8,-2" stroke="${b.c}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <circle r="16" fill="${b.c}" stroke="rgba(0,0,0,.28)" stroke-width="1.5"/>
  <ellipse cx="3" cy="6" rx="10.5" ry="8.5" fill="#fff" opacity=".5"/>
  <ellipse cx="-6" cy="1" rx="8" ry="5.2" fill="rgba(0,0,0,.16)" transform="rotate(-18 -6 1)"/>
  <circle cx="7" cy="-5" r="3.4" fill="#2D2340"/><circle cx="8.2" cy="-6.2" r="1.15" fill="#fff"/>
  <circle cx="10.5" cy="1.5" r="2.5" fill="#FF8FA3" opacity=".6"/>
  <polygon points="14.5,-3.2 22,-0.6 14.5,2.2" fill="#FFA94D" stroke="#B35C00" stroke-width="1"/>
  <path d="M-3,15.5v4 M3,15.5v4" stroke="#B35C00" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(3 6)" fill="${b.k}" opacity=".85">${BIRD_MARK[b.m]}</g></g></svg>`;
}
/* Rules shared by the game, the hint helper, and the solver */
function bTopRun(br){if(!br.length)return 0;const c=br[br.length-1];let k=0;for(let i=br.length-1;i>=0&&br[i]===c;i--)k++;return k}
function bCanMove(bs,a,b,cap){const A=bs[a],B=bs[b];if(a===b||!A.length||B.length>=cap)return false;return !B.length||B[B.length-1]===A[A.length-1]}
function bApply(bs,a,b,cap){const A=bs[a],B=bs[b];const n=Math.min(bTopRun(A),cap-B.length);for(let i=0;i<n;i++)B.push(A.pop());return n}
function bDone(br,cap){return br.length===cap&&br.every(c=>c===br[0])}
function bKey(bs){return bs.map(b=>b.join("")).sort().join("|")}
/* Depth-first solver with memory: finds a sequence of moves that flies every flock home */
function birdSolve(start,cap,limit){
  const seen=new Set();let nodes=0;
  const clear=bs=>{bs.forEach((b,i)=>{if(bDone(b,cap))bs[i]=[]})};
  function moves(bs){
    const out=[];let firstEmpty=-1;
    bs.forEach((b,i)=>{if(!b.length&&firstEmpty<0)firstEmpty=i});
    for(let a=0;a<bs.length;a++){const A=bs[a];if(!A.length)continue;const run=bTopRun(A);
      for(let b=0;b<bs.length;b++){
        if(!bCanMove(bs,a,b,cap))continue;
        const B=bs[b];
        if(!B.length){if(b!==firstEmpty||run===A.length)continue}
        const fits=Math.min(run,cap-B.length);
        out.push({a,b,s:(B.length?10:0)+(B.length+fits===cap?20:0)+(run===A.length&&B.length?5:0)});
      }}
    return out.sort((x,y)=>y.s-x.s);
  }
  const path=[];
  function dfs(bs){
    if(bs.every(b=>!b.length))return true;
    if(++nodes>limit)return false;
    const k=bKey(bs);if(seen.has(k))return false;seen.add(k);
    for(const m of moves(bs)){
      const nb=bs.map(b=>b.slice());bApply(nb,m.a,m.b,cap);clear(nb);
      path.push([m.a,m.b]);if(dfs(nb))return true;path.pop();
      if(nodes>limit)return false;
    }
    return false;
  }
  const s=start.map(b=>b.slice());clear(s);
  return dfs(s)?path.slice():null;
}
function birdDeal(level){
  const L=BIRD_LEVELS[clamp(level,1,5)-1];
  for(let t=0;t<300;t++){
    const birds=shuffle([].concat(...Array.from({length:L.k},(_,c)=>Array(L.cap).fill(c))));
    const bs=[];for(let i=0;i<L.k;i++)bs.push(birds.slice(i*L.cap,(i+1)*L.cap));
    bs.push([],[]);
    if(bs.some(b=>b.length&&b.every(c=>c===b[0])))continue;
    const sol=birdSolve(bs,L.cap,40000);
    if(sol)return{bs:shuffle(bs),cap:L.cap,k:L.k,par:sol.length};
  }
  return null;
}
GAMEFN.birds=function(level,done){
  const area=$("#area");
  const deal=birdDeal(level);
  const cap=deal.cap,K=deal.k,start=deal.bs.map(b=>b.slice());
  let plan=null,bs=start.map(b=>b.slice()),sel=-1,hist=[],moves=0,hints=0,undos=0,restarts=0,extra=0,home=0,busy=false,finished=false;
  area.innerHTML=`<div class="btools mjbar"><button class="btn alt" id="bHint">💡 Hint</button><button class="btn ghost" id="bUndo">↩️ Undo</button><button class="btn ghost" id="bRestart">🔄 Restart</button><button class="btn green" id="bExtra">🌿 Add branch</button></div><div class="bboard" id="bBoard"></div>`;
  const board=$("#bBoard");
  function birdSize(){const w=Math.min(board.clientWidth||320,700);const col=(w-30)/2;return Math.max(30,Math.min(64,Math.floor((col-12)/(cap*0.74+0.26))))}
  function draw(lift,flyIdx){
    const s=birdSize();board.style.setProperty("--bs",s+"px");
    board.innerHTML=bs.map((br,i)=>{
      const right=i%2===1,run=(i===sel)?bTopRun(br):0;
      const birds=br.map((c,j)=>`<span class="bird ${j>=br.length-run?"up":""} ${flyIdx===i?"fly":""} ${lift&&lift.b===i&&j>=br.length-lift.n?"hop":""}" style="z-index:${right?100-j:j+1}">${birdSVG(c,right)}</span>`).join("");
      return `<button class="branch ${right?"R":"L"} ${i===sel?"sel":""}" data-b="${i}" aria-label="Branch ${i+1}: ${br.length?br.map(c=>BIRD_COLORS[c].n).join(", "):"empty"}"><span class="perch">${birds}</span><span class="bar"></span></button>`}).join("");
    $$("#bBoard .branch").forEach(b=>b.onclick=()=>tap(+b.dataset.b));
    status(`Flocks flown home: ${home} of ${K} · Moves: ${moves}`);
    $("#bUndo").disabled=!hist.length;$("#bExtra").disabled=extra>0;
  }
  function snapshot(){hist.push({bs:bs.map(b=>b.slice()),home})}
  function clearHint(){$$("#bBoard .branch").forEach(b=>b.classList.remove("hint"))}
  function tap(i){
    if(busy||finished)return;clearHint();
    const br=bs[i];
    if(sel<0){
      if(!br.length){sfx.soft();fb("That branch is empty. Tap a branch with birds first. 🐦","soft");return}
      sel=i;sfx.chirp(1);fb(`Now tap the branch where they should fly. ${N()}, you've got this!`);draw();return;
    }
    if(sel===i){sel=-1;sfx.pop();fb("");draw();return}
    if(bCanMove(bs,sel,i,cap)){
      snapshot();const n=bApply(bs,sel,i,cap);moves++;sel=-1;sfx.flap();sfx.chirp(2);
      draw({b:i,n});
      if(bDone(bs[i],cap)){busy=true;
        later(()=>{draw(null,i);sfx.chirpSong();goodFb("The whole flock is together! 🎉")},350);
        later(()=>{bs[i]=[];home++;busy=false;draw();
          if(home>=K){finished=true;sfx.sparkle();confetti(60);
            const norm=Math.max(40,100-Math.max(0,moves-deal.par-3)*2-hints*6-extra*12-restarts*8-undos);
            later(()=>done({norm,detail:`All ${K} flocks flew home together in ${moves} moves!${hints?` (${hints} hint${hints>1?"s":""} used)`:""}`}),900)}
        },1250);
      }else fb(rnd(["Lovely move! 🐦","Tweet tweet! 🎵","Nice and tidy!","Good thinking!"]),"good");
      return;
    }
    if(!br.length||br.length>=cap){sfx.soft();fb(br.length>=cap?"That branch is full. Try another one! 😊":"Hmm, try another branch. 😊","soft");return}
    sfx.soft();fb(`Birds only join their own color. Let's pick up this branch instead.`,"soft");sel=i;draw();
  }
  $("#bUndo").onclick=()=>{const h=hist.pop();if(!h)return;bs=h.bs;home=h.home;sel=-1;undos++;clearHint();sfx.pop();fb("Birds back where they were. 👍");draw()};
  $("#bRestart").onclick=()=>{bs=start.map(b=>b.slice());hist=[];home=0;sel=-1;moves=0;restarts++;extra=0;sfx.flap();fb("A fresh start with the same birds. You can do it! 🌱");draw()};
  $("#bExtra").onclick=()=>{if(extra||busy||finished)return;extra=1;bs.push([]);plan=null;sfx.sparkle();fb("Here's an extra branch to help. 🌿");draw()};
  $("#bHint").onclick=()=>{
    if(busy||finished)return;
    clearHint();
    const rawKey=x=>x.map(b=>b.join(",")).join("|");
    const cur=rawKey(bs);let j=plan?plan.keys.indexOf(cur):-1;
    if(j<0){
      const sol=birdSolve(bs,cap,60000);
      if(sol){const keys=[],sim=bs.map(b=>b.slice());sol.forEach(([a,b])=>{keys.push(rawKey(sim));bApply(sim,a,b,cap);sim.forEach((x,i)=>{if(bDone(x,cap))sim[i]=[]})});plan={sol,keys};j=0}else plan=null;
    }
    const sol=plan?plan.sol.slice(j):null;
    if(!sol||!sol.length){fb(extra?"Let's tap Undo a few times or Restart, and try a new path. 💛":"Try the 🌿 Extra branch button or Undo. There's always a way! 💛","soft");return}
    hints++;sel=-1;draw();const [a,b]=sol[0];
    const el=$$("#bBoard .branch");el[a].classList.add("hint");el[b].classList.add("hint");el[a].dataset.hint="from";el[b].dataset.hint="to";sfx.sparkle();
    fb(`Try moving the birds from one glowing branch to the other. ✨`);
  };
  draw();fb(`Help the birds sit with their own color, ${N()}! Tap a branch to pick up the birds on the end. 🐦`);
  const onR=()=>{if(!board.isConnected){window.removeEventListener("resize",onR);return}draw()};
  window.addEventListener("resize",onR);
  if(window.innerHeight<900)later(()=>{const bar=$(".mjbar");if(bar)window.scrollTo({top:bar.getBoundingClientRect().top+window.scrollY-70,behavior:"smooth"})},400);
};

$("#toast").onclick=()=>$("#toast").classList.remove("show");
$("#soundBtn").onclick=()=>{S.set.muted=!S.set.muted;save();applySettings();sfx.pop();toast(S.set.muted?"Sounds off 🔇":"Sounds on 🔊",1800)};
$$("#nav button").forEach(b=>b.onclick=()=>{if(!S.name)return;sfx.pop();const n=b.dataset.nav;go(n==="home"?showHome:n==="wellness"?()=>showWellness():n==="progress"?showProgress:showSettings)});

if(S.name){showHome();setTimeout(()=>toast(`💛 Welcome back, ${N()}! ${aff()}`,6000),700)}else showWelcome();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{})})}
